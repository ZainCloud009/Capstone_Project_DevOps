name: CapStone CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # STAGE 1: Automated Testing & Verification
  # ==========================================
  test:
    name: Run Tests & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, sqlite3, curl, zip, fileinfo
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --graceful --ansi

      - name: Execute Tests (PHPUnit)
        run: php artisan test --compact

  # ==========================================
  # STAGE 2: Build & Push Docker Image to AWS ECR
  # ==========================================
  build-and-push:
    name: Build & Push Docker Image to AWS ECR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
      image: ${{ steps.set-image.outputs.image }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-north-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Metadata for Docker Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY || 'capstoneprojrepo' }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image to Amazon ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set Image URI Output
        id: set-image
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY || 'capstoneprojrepo' }}:sha-${SHORT_SHA}" >> $GITHUB_OUTPUT

  # ==========================================
  # STAGE 3: Auto Deployment to AWS EC2 from ECR
  # ==========================================
  deploy:
    name: Deploy to AWS EC2 from ECR
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-north-1' }}

      - name: Discover EC2 Host IP
        id: get-host
        run: |
          echo "Querying running EC2 instances from Auto Scaling Group..."
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --region "${{ secrets.AWS_REGION || 'eu-north-1' }}" \
            --query "AutoScalingGroups[?contains(AutoScalingGroupName, 'capstone-asg')].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text)

          if [ -n "$INSTANCE_IDS" ]; then
            IPS=$(aws ec2 describe-instances \
              --instance-ids $INSTANCE_IDS \
              --query "Reservations[*].Instances[*].PublicIpAddress" \
              --output text \
              --region "${{ secrets.AWS_REGION || 'eu-north-1' }}")
          else
            IPS=$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=capstone-asg-server" "Name=instance-state-name,Values=running" \
              --query "Reservations[*].Instances[*].PublicIpAddress" \
              --output text \
              --region "${{ secrets.AWS_REGION || 'eu-north-1' }}")
          fi

          # Format space-separated IPs into comma-separated list for multi-host SSH
          HOSTS=$(echo "$IPS" | xargs | tr ' ' ',')

          if [ -n "$HOSTS" ] && [ "$HOSTS" != "None" ]; then
            echo "Discovered live EC2 Host(s): $HOSTS"
            echo "host=$HOSTS" >> $GITHUB_OUTPUT
          elif [ -n "${{ secrets.EC2_HOST }}" ]; then
            echo "Falling back to secrets.EC2_HOST: ${{ secrets.EC2_HOST }}"
            echo "host=${{ secrets.EC2_HOST }}" >> $GITHUB_OUTPUT
          else
            echo "Error: No running EC2 instances found in Auto Scaling Group!"
            exit 1
          fi

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-north-1' }}
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'capstoneprojrepo' }}
        with:
          host: ${{ steps.get-host.outputs.host }}
          username: ${{ secrets.EC2_USER || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,ECR_REGISTRY,ECR_REPOSITORY
          script: |
            set -e

            echo "==> Starting CapStone Deployment on AWS EC2..."

            # Ensure AWS_REGION and ECR_REPOSITORY defaults
            AWS_REGION="${AWS_REGION:-eu-north-1}"
            ECR_REPOSITORY="${ECR_REPOSITORY:-capstoneprojrepo}"

            # Fallback for ECR_REGISTRY if empty
            if [ -z "$ECR_REGISTRY" ] || [ "$ECR_REGISTRY" = "" ]; then
              AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || echo "634236768016")
              ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            fi

            # Authenticate Docker with Amazon ECR & pull latest image backup
            echo "==> Authenticating Docker with Amazon ECR ($ECR_REGISTRY)..."
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY" || true
            DOCKER_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
            docker pull "$DOCKER_IMAGE" || true

            # Stop any conflicting Docker container on port 80 so Apache owns port 80
            echo "==> Ensuring Port 80 is dedicated to Apache..."
            sudo docker stop capstone_app 2>/dev/null || true
            sudo docker rm capstone_app 2>/dev/null || true

            # Discover RDS MySQL endpoint dynamically
            RDS_HOST=$(aws rds describe-db-instances \
              --db-instance-identifier capstone-mysql-db \
              --query "DBInstances[0].Endpoint.Address" \
              --output text \
              --region "$AWS_REGION" 2>/dev/null || echo "127.0.0.1")

            APP_DIR="/var/www/html/Capstone_Project_DevOps"
            sudo mkdir -p "$APP_DIR"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "==> Cloning application to $APP_DIR..."
              sudo git clone https://github.com/ZainCloud009/Capstone_Project_DevOps.git "$APP_DIR"
            else
              echo "==> Pulling latest changes from Git..."
              cd "$APP_DIR"
              sudo git fetch origin main
              sudo git reset --hard origin/main
            fi

            cd "$APP_DIR"

            # Configure .env with RDS credentials
            if [ ! -f .env ]; then
              sudo cp .env.example .env
              sudo sed -i "s/DB_HOST=127.0.0.1/DB_HOST=$RDS_HOST/" .env
              sudo sed -i "s/DB_DATABASE=laravel/DB_DATABASE=idea/" .env
              sudo sed -i "s/DB_USERNAME=root/DB_USERNAME=admin/" .env
              sudo sed -i "s/DB_PASSWORD=/DB_PASSWORD=RootPassword123!/" .env
              sudo sed -i "s|APP_URL=http://localhost|APP_URL=https://iamzain.space|" .env
              sudo sed -i "s/APP_ENV=local/APP_ENV=production/" .env
              sudo sed -i "s/APP_DEBUG=true/APP_DEBUG=false/" .env
              sudo php artisan key:generate --force || true
            else
              sudo sed -i "s/DB_HOST=.*/DB_HOST=$RDS_HOST/" .env
            fi

            # Install Composer packages
            echo "==> Installing Composer packages..."
            sudo COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader --no-interaction || true

            # Run Database Migrations & Laravel caching
            echo "==> Running migrations & Laravel optimization..."
            sudo php artisan migrate --force || true
            sudo php artisan storage:link || true
            sudo php artisan config:cache || true
            sudo php artisan route:cache || true
            sudo php artisan view:cache || true

            # Build Frontend Assets with NPM
            echo "==> Building frontend assets with NPM..."
            sudo npm install || true
            sudo npm run build || true

            # Configure Apache VirtualHost on Port 80
            echo "==> Configuring Apache VirtualHost on Port 80..."
            sudo tee /etc/httpd/conf.d/capstone.conf > /dev/null <<'APACHECONF'
<VirtualHost *:80>
    ServerName iamzain.space
    ServerAlias iamzain.space
    ServerAdmin www@localhost
    DocumentRoot "/var/www/html/Capstone_Project_DevOps/public"
    AccessFileName .htaccess

    Alias /phpmyadmin /var/www/html/phpmyadmin
    <Directory "/var/www/html/phpmyadmin">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory "/var/www/html/Capstone_Project_DevOps/public">
        Options Indexes FollowSymLinks
        Order allow,deny
        Allow from All
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /var/log/httpd/capstone_error.log
    CustomLog /var/log/httpd/capstone_access.log combined
</VirtualHost>
APACHECONF

            # Fix permissions for Apache
            sudo chown -R apache:apache /var/www/html
            sudo chmod -R 775 "$APP_DIR/storage" "$APP_DIR/bootstrap/cache" || true

            # Enable and restart PHP-FPM and Apache HTTPD
            echo "==> Restarting PHP-FPM and Apache HTTPD..."
            sudo systemctl enable --now php-fpm
            sudo systemctl enable --now httpd
            sudo systemctl restart php-fpm
            sudo systemctl restart httpd

            echo "==> CapStone Deployment on Apache completed successfully!"
