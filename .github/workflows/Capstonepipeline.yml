name: CapStone CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # STAGE 1: Automated Testing & Verification
  # ==========================================
  test:
    name: Run Tests & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, sqlite3, curl, zip, fileinfo
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --graceful --ansi

      - name: Execute Tests (PHPUnit)
        run: php artisan test --compact

  # ==========================================
  # STAGE 2: Build & Push Docker Image
  # ==========================================
  build-and-push:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Image Name in Lowercase
        run: |
          IMAGE_NAME=$(echo "${{ secrets.DOCKERHUB_USERNAME }}/capstone-project" | tr '[:upper:]' '[:lower:]')
          echo "DOCKER_IMAGE=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata for Docker Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # STAGE 3: Auto Deployment to AWS EC2
  # ==========================================
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "==> Starting CapStone Deployment on AWS EC2..."

            APP_DIR="~/capstone-app"
            mkdir -p $APP_DIR
            cd $APP_DIR

            # Clone repository if first time, or pull latest changes
            if [ -d .git ]; then
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git pull origin main
            else
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            fi

            # Determine docker-compose command syntax or auto-install if missing
            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "==> Docker Compose not found on EC2. Auto-installing Docker Compose..."
              mkdir -p ~/.docker/cli-plugins
              ARCH=$(uname -m)
              [ "$ARCH" = "x86_64" ] && COMPOSE_ARCH="x86_64" || COMPOSE_ARCH="aarch64"
              curl -sSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-${COMPOSE_ARCH}" -o ~/.docker/cli-plugins/docker-compose
              chmod +x ~/.docker/cli-plugins/docker-compose

              if sudo -n true 2>/dev/null; then
                sudo cp ~/.docker/cli-plugins/docker-compose /usr/local/bin/docker-compose
                sudo chmod +x /usr/local/bin/docker-compose
              fi

              if docker compose version >/dev/null 2>&1; then
                COMPOSE_CMD="docker compose"
              elif command -v docker-compose >/dev/null 2>&1; then
                COMPOSE_CMD="docker-compose"
              else
                COMPOSE_CMD="$HOME/.docker/cli-plugins/docker-compose"
              fi
            fi

            echo "==> Using compose command: $COMPOSE_CMD"

            # Export Docker image tag in lowercase
            DOCKER_IMAGE=$(echo "${{ secrets.DOCKERHUB_USERNAME }}/capstone-project:latest" | tr '[:upper:]' '[:lower:]')
            export DOCKER_IMAGE

            # Pull latest application image from Docker Hub
            echo "==> Pulling latest Docker image: $DOCKER_IMAGE"
            docker pull $DOCKER_IMAGE

            # Recreate containers with latest image
            echo "==> Starting containers via $COMPOSE_CMD..."
            $COMPOSE_CMD down --remove-orphans || true
            $COMPOSE_CMD up -d --remove-orphans

            # Allow database service a few moments to initialize
            echo "==> Waiting for database container to initialize..."
            sleep 15

            # Run database migrations and cache commands inside container
            echo "==> Running migrations and optimization..."
            $COMPOSE_CMD exec -T app php artisan migrate --force || true
            $COMPOSE_CMD exec -T app php artisan config:cache || true
            $COMPOSE_CMD exec -T app php artisan route:cache || true
            $COMPOSE_CMD exec -T app php artisan view:cache || true

            echo "==> Deployment to AWS EC2 completed successfully!"
